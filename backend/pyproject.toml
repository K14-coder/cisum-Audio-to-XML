[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cisum"
version = "0.1.0"
description = "Turn a song recording into playable piano arrangements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "music21>=9.1",
    "verovio>=4.3",
    "cairosvg>=2.7",
    "pypdf>=4.0",
    "mido>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "rq>=1.16",
    "redis>=5.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
# Neural backends. Each stage falls back to a DSP method when its model is missing.
# Basic Pitch is installed separately with --no-deps (see requirements-ml.txt).
ml = [
    "torch>=2.3",
    "torchcrepe>=0.0.22",
    "onnxruntime>=1.17",
    "resampy>=0.2.2,<0.4.3",
    # torchcrepe and resampy (which Basic Pitch needs) import pkg_resources, which
    # setuptools dropped in 81. With a newer one both fail to import and the
    # pipeline quietly falls back to pYIN and no note transcription.
    "setuptools<81",
    "pretty-midi>=0.2.9",
    "mir-eval>=0.6",
    "scikit-learn>=1.3",
    "demucs>=4.0.1",
    "beat-this>=0.1",
]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "moto[s3]>=5",
]

[project.scripts]
cisum = "cisum.engine.cli:main"

[tool.setuptools.packages.find]
include = ["cisum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs neural models or the full pipeline (deselect with -m 'not slow')",
]
